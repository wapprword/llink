<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Netflix 跳转</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .container {
      text-align: center;
    }

    .netflix-button {
      display: inline-block;

      padding: 14px 30px;

      border: none;
      border-radius: 6px;

      background: #e50914;
      color: #fff;

      font-size: 18px;
      font-weight: 600;

      text-decoration: none;

      cursor: pointer;

      transition:
        background 0.15s ease,
        transform 0.1s ease;
    }

    .netflix-button:hover {
      background: #f6121d;
    }

    .netflix-button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="container">

    <button
      type="button"
      class="netflix-button"
      id="openNetflix"
    >
      进入 Netflix
    </button>

  </div>

  <script>

    const netflixUrl =
      "https://netflix.com/?nftoken=BgjCwOvcAxL%2BAVK11CdFkB9glJLiaWwlojm%2BSWJljoEVs5QBtJw3q27AUu19S05YNB9HYd9KQythBxydyix%2Fzqo6KqZmZpJFCgkISj0D2vWoKMupOYBuwL%2BTcP%2F0LZVgeAIuxSI6Z0N%2B4xWUS9k4oeaGYIYx%2BSmExWVJst8wemhYfOakXxwWdkTaPWOBzFFc58ckwO0dmKuuygJGsovbaxEYTbyiSY7IFDdCTo9mYqhmQEiibSBEh%2BMvbX5Ap9CxnfxqplIVF3ZEecoc9nKb1OWeyxji6Fvv04xCRd0aPXia%2Bu%2FKqyKdW2wvCzSJ0JmgwuQDo5HD9hloD9Z0dGevhME4uWTbuJhYGAYiDgoMLW5Sq8fVU%2Fde4dYl";


    document
      .getElementById("openNetflix")
      .addEventListener("click", function () {

        /*
         * 点击按钮后：
         *
         * 当前标签页：
         * GitHub Pages
         *
         * 新标签页：
         * Netflix Token URL
         */

        const newTab = window.open(

         */

        if (!newTab) {

          alert(
            "浏览器阻止了新标签页，请允许此网站打开弹出窗口。"
          );

        }

      });

  </script>

</body>

</html>
