<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Netflix 跳转</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .container {
      text-align: center;
    }

    .netflix-button {
      padding: 14px 30px;

      border: 0;
      border-radius: 6px;

      background: #e50914;
      color: #fff;

      font-size: 18px;
      font-weight: 600;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .netflix-button:hover {
      background: #f6121d;
    }

    .netflix-button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="container">

    <button
      type="button"
      class="netflix-button"
      id="openNetflix"
    >
      进入 Netflix
    </button>

  </div>

  <script>

    // Netflix Token 登录地址
    const netflixUrl =
      "https://netflix.com/?nftoken=BgjCwOvcAxLCAfbx%2B3D%2FtxnAMb9bgZ97hW33uvPnfinsSkCXvc5Avtt%2F4j6K%2F7IAQ2KtKXOvCxv6Gt2scmPd0uEsZEV0qZGcVauElOIDi0%2BUxZ%2FckxwM9HcytLBvqVe99vi3G01zzdbS1%2FtmuZD%2BRchYXmdEVEoitRXGyx5Ibc8T%2FUhoQdnfAT5BWu5DtTBNpVVvQXtetC%2BmhtRfWiJh4pwPwf9jZkmYw3%2FysxDhPxWkz%2BcwIhTXHXEnGcO3qBRRedAXqhaQDQuVVxNiGAYiDgoMAzLFBq3cE2RtHDyg";


    document
      .getElementById("openNetflix")
      .addEventListener("click", function () {

        // 用户点击按钮后立即创建新标签页
        const newTab = window.open(
          netflixUrl,
          "_blank"
        );

        // 如果浏览器阻止弹窗
        if (!newTab) {

          alert(
            "浏览器阻止了新标签页，请允许此网站打开新窗口/标签页。"
          );

        }

      });

  </script>

</body>

</html>
